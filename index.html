      ctx.textAlign='left';
    }
  }
  // Intentó un truco sin altura: hay que decirle por qué no salió
  if (noAirHint > 0){
    ctx.save(); ctx.globalAlpha = Math.min(1, noAirHint*2.5);
    ctx.textAlign='center'; ctx.font='bold 14px Impact,Arial Black,sans-serif';
    outText('SIN ALTURA — BUSCA UNA RAMPA', W/2, H-92, '#f5c518', 4);
    ctx.restore(); ctx.textAlign='left';
  }

  // Popup de truco
  if (trick){
    var a = Math.min(1, trick.t*2.4);
    ctx.save(); ctx.globalAlpha = a;
    ctx.textAlign='center';
    var pop = 1 + Math.max(0, (1.5-trick.t))*0.0;
    ctx.font='bold 30px Impact,Arial Black,sans-serif';
    outText(trick.label, W/2, 108, trick.pts?'#fff':'#ff5544', 5);
    if (trick.pts){
      ctx.font='bold 16px Impact,Arial Black,sans-serif';
      outText('+'+trick.pts, W/2, 132, '#f5c518', 4);
      if (trick.combo > 1){
        ctx.font='bold 12px Arial';
        outText('COMBO x'+trick.combo, W/2, 150, '#6fd0ff', 3);
      }
    }
    ctx.restore(); ctx.textAlign='left';
  }
}

// ── Selección de etapa ──────────────────────────────────────────────
var STAGE_IDS = ['bosque','valpo'];
var pickIdx = 0;

function stageCard(x, y, w, h, id, sel){
  var st = STAGES[id];
  ctx.save();
  panel(x, y, w, h, 12);
  if (sel){
    ctx.strokeStyle = '#6fd0ff'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x+12,y); ctx.arcTo(x+w,y,x+w,y+h,12); ctx.arcTo(x+w,y+h,x,y+h,12);
    ctx.arcTo(x,y+h,x,y,12); ctx.arcTo(x,y,x+w,y,12); ctx.closePath(); ctx.stroke();
  }
  // Miniatura del escenario: cielo y cerros propios de la etapa
  var th = 66;
  ctx.save();
  ctx.beginPath(); ctx.rect(x+10, y+10, w-20, th); ctx.clip();
  var g = ctx.createLinearGradient(0, y+10, 0, y+10+th);
  st.sky.forEach(function(s2){ g.addColorStop(s2[0], s2[1]); });
  ctx.fillStyle = g; ctx.fillRect(x+10, y+10, w-20, th);
  for (var r=0;r<st.ridges.length;r++){
    var R = st.ridges[r];
    ctx.fillStyle = R.col;
    ctx.beginPath(); ctx.moveTo(x+10, y+10+th);
    for (var px=0; px<=w-20; px+=6){
      var t = px*0.03*R.freq + r*2;
      ctx.lineTo(x+10+px, y+42 + r*7 - Math.sin(t)*13 - Math.sin(t*2.1)*6);
    }
    ctx.lineTo(x+w-10, y+10+th); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = st.light.road;
  ctx.beginPath();
  ctx.moveTo(x+w/2-4, y+46); ctx.lineTo(x+w/2+4, y+46);
  ctx.lineTo(x+w/2+34, y+10+th); ctx.lineTo(x+w/2-34, y+10+th);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.textAlign='left';
  ctx.font='bold 20px Impact,Arial Black,sans-serif'; ctx.fillStyle = sel ? '#fff' : 'rgba(255,255,255,.75)';
  ctx.fillText(st.name, x+14, y+th+34);
  ctx.font='9px Arial'; ctx.fillStyle='#6fd0ff';
  ctx.fillText(st.place, x+14, y+th+48);
  ctx.font='bold 10px Arial'; ctx.fillStyle='rgba(255,255,255,.8)';
  ctx.fillText(st.km.toFixed(1)+' KM', x+14, y+th+68);
  ctx.textAlign='right';
  ctx.font='bold 11px Arial';
  ctx.fillStyle = bestTime[id] ? '#5ef0b4' : 'rgba(255,255,255,.35)';
  ctx.fillText(fmtTime(bestTime[id]), x+w-14, y+th+68);
  ctx.restore();
}

// ════════════════════════════════════════════════════════════════════
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  drawSky();

  ctx.save();
  if (shake > 0.05){
    ctx.translate(rnd(-shake,shake), rnd(-shake,shake));
  }
  drawBackdrop();
  renderRoad();
  drawRider();
  ctx.restore();

  drawSpeedFx();

  if (phase === 'playing') hud();
  else if (phase === 'menu') menu();
  else if (phase === 'finish') { hud(); finishScreen(); }
  else { hud(); gameover(); }
}

// ════════════════════════════════════════════════════════════════════
//  BUCLE — paso fijo + acumulador
// ════════════════════════════════════════════════════════════════════
var STEP = 1/60, acc = 0, last = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (!last) last = now;
  var dt = Math.min(0.25, (now - last)/1000);
  last = now;

  if (phase === 'playing'){
    acc += dt;
    var guard = 0;
    while (acc >= STEP && guard++ < 8){ update(STEP); acc -= STEP; }
  } else {
    elapsed += dt;
    if (shake > 0) shake = Math.max(0, shake - dt*18);
    if (flash > 0) flash = Math.max(0, flash - dt*3.4);
    updateParts(dt);
  }
  if (splitFlash > 0) splitFlash = Math.max(0, splitFlash - dt*1.6);
  updateRig(dt);
  updateWind();
  try { render(); } catch(e){ console.error(e); }
}

// ════════════════════════════════════════════════════════════════════
//  CONTROLES
// ════════════════════════════════════════════════════════════════════
var KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  Space:'jump', ShiftLeft:'brake'
};
// Desde el menú, ← → eligen etapa y cualquier otra tecla larga.
// Desde meta o abandono, se vuelve al menú de etapas.
function advance(){
  if (phase === 'menu'){ stageId = STAGE_IDS[pickIdx]; resetRun(); }
  else if (phase === 'finish'){ phase = 'menu'; }
  else if (phase === 'gameover'){ resetRun(); }
}
document.addEventListener('keydown', function(e){
  var k = KEYMAP[e.code];
  if (k){ keys[k] = true; e.preventDefault(); }
  initAudio();
  if (phase === 'menu' && (k === 'left' || k === 'right')){
    pickIdx = k === 'left' ? 0 : 1;
    return;
  }
  if (phase !== 'playing') advance();
});
document.addEventListener('keyup', function(e){
  var k = KEYMAP[e.code];
  if (k) keys[k] = false;
});

function touchX(e){
  var r = cv.getBoundingClientRect();
  var t = e.touches[0];
  if (cv._portrait){ return (1 - (t.clientY - r.top)/r.height) * W; }
  return (t.clientX - r.left)/r.width * W;
}
function touchY(e){
  var r = cv.getBoundingClientRect();
  var t = e.touches[0];
  if (cv._portrait){ return (t.clientX - r.left)/r.width * H; }
  return (t.clientY - r.top)/r.height * H;
}
cv.addEventListener('touchstart', function(e){
  e.preventDefault(); initAudio();
  if (phase === 'menu'){ pickIdx = touchX(e) < W/2 ? 0 : 1; advance(); return; }
  if (phase !== 'playing'){ advance(); return; }
  var x = touchX(e), y = touchY(e);
  if (y < H*0.45){ // mitad superior = trucos
    keys.up = x > W/2; keys.down = x <= W/2;
    touchJump = true;
  } else {
    touchDir = x < W*0.42 ? -1 : (x > W*0.58 ? 1 : 0);
    if (touchDir === 0) touchJump = true;
  }
}, {passive:false});
cv.addEventListener('touchmove', function(e){
  e.preventDefault();
  if (phase !== 'playing') return;
  var x = touchX(e), y = touchY(e);
  if (y >= H*0.45) touchDir = x < W*0.42 ? -1 : (x > W*0.58 ? 1 : 0);
}, {passive:false});
cv.addEventListener('touchend', function(){ touchDir = 0; keys.up=false; keys.down=false; }, {passive:false});
cv.addEventListener('click', function(e){
  initAudio();
  if (phase === 'playing') return;
  if (phase === 'menu'){
    var r = cv.getBoundingClientRect();
    pickIdx = ((e.clientX - r.left) / r.width) < 0.5 ? 0 : 1;
  }
  advance();
});

document.getElementById('skinBtn').addEventListener('click', function(e){
  e.stopPropagation();
  skin = SKINS[(SKINS.indexOf(skin)+1) % SKINS.length];
  this.textContent = SKIN_LABEL[skin];
});
document.getElementById('muteBtn').addEventListener('click', function(e){
  e.stopPropagation();
  muted = !muted;
  this.textContent = muted ? '🔇' : '🔊';
});

//  ESCALADO A PANTALLA

function resize(){
  var vw = window.innerWidth, vh = window.innerHeight;
  var portrait = vw < vh;
  cv._portrait = portrait;
  if (portrait){
    var s = Math.min(vw/H, vh/W);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    cv.style.transformOrigin = (W/2)+'px '+(H/2)+'px';
    cv.style.transform = 'translate('+((vw-W)/2)+'px,'+((vh-H)/2)+'px) rotate(-90deg) scale('+s+')';
  } else {
    var s2 = Math.min(vw/W, vh/H);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    cv.style.transformOrigin = 'center center';
    cv.style.transform = 'scale('+s2+')';
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 150); });

// ── Arranque ────────────────────────────────────────────────────────
buildSprites();
resetTrack();
resize();
requestAnimationFrame(frame);
</script>
